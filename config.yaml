citations:
  - {name: FluoResFM, doi: 'https://doi.org/10.1038/s41467-026-70307-4', license: MIT, description: Pretrained fluorescence image restoration}
  - {name: UniFMIR, doi: 'https://doi.org/10.1038/s41592-024-02244-3', license: GPL-3.0, description: Pretrained microscopy restoration}
docker_image:
  org: cellularimagingcf
  name: w_cidenoise
  tag: v0.1.0
  platform: linux/amd64
algorithm_folder_name: cidenoise_inference
exec_function:
  name: generate_cli_command
  cli_command: python wrapper.py
  hidden_args:
    - {cli_tag: --local, value: 'true', append_value: false, cli_order: 3}
inputs:
  - name: infolder
    type: image
    label: Input OME-Zarrs
    description: Folder of NGFF 0.4 Zarr v2 images or HCS plates.
    cli_tag: --infolder
    cli_order: 1
    default: directory
    optional: false
    format: [zarr]
    unique_string: [.ome.zarr]
    folder_name: /data/in
    file_count: multiple
    section_id: inputs
    mode: beginner
    subtype: [grayscale, color]
    depth: true
    timepoints: true
    tiled: true
    pyramidal: true
outputs:
  - name: outfolder
    type: image
    label: Denoised images or benchmark PNGs
    description: New OME-Zarr stores; benchmark mode writes colour-overlay PNGs only.
    cli_tag: --outfolder
    cli_order: 2
    default: directory
    optional: false
    format: [zarr, png]
    unique_string: [.ome.zarr, .png]
    folder_name: /data/out
    file_count: multiple
    section_id: outputs
    mode: beginner
    subtype: [grayscale, color]
    depth: true
    timepoints: true
    tiled: true
    pyramidal: true
display_only: []
parameters:
  - {name: channels, type: string, label: Channels, description: 'all or one-based numbers such as 1,3', default: all, cli_tag: --channels, cli_order: 9, optional: true, section_id: essential, mode: beginner}
  - name: model
    type: dropdown
    label: Pretrained Model
    description: Explicit checkpoint selection; no training or automatic model substitution.
    options:
      - {label: FluoResFM, value: fluoresfm}
      - {label: Noise2Noise FMD (fast CNN), value: noise2noise-fmd}
      - {label: Cellpose denoise cyto3, value: cellpose-cyto3}
      - {label: Cellpose denoise nuclei, value: cellpose-nuclei}
      - {label: UniFMIR Planaria (single plane), value: unifmir-planaria}
      - {label: UniFMIR Tribolium (five Z planes), value: unifmir-tribolium}
    default: noise2noise-fmd
    cli_tag: --model
    cli_order: 10
    optional: true
    section_id: essential
    mode: beginner
  - name: benchmark
    type: dropdown
    label: Visual Benchmark Gallery
    description: All models and channels; PNG gallery only. 2D shows the middle Z-plane; 3D processes all Z and shows a maximum projection. Crop uses centre 512x512 XY.
    options: [{label: "Off", value: 'off'}, {label: 2D Full, value: 2d-full}, {label: 2D Crop, value: 2d-crop}, {label: 3D Full, value: 3d-full}, {label: 3D Crop, value: 3d-crop}]
    default: 'off'
    cli_tag: --benchmark
    cli_order: 11
    optional: true
    section_id: essential
    mode: beginner
  - name: device
    type: dropdown
    label: Compute Device
    description: All models; automatic selects CUDA when available and CPU otherwise.
    options: [{label: Automatic, value: auto}, {label: NVIDIA CUDA, value: cuda}, {label: CPU, value: cpu}]
    default: auto
    cli_tag: --device
    cli_order: 12
    optional: true
    section_id: advanced
    mode: advanced
  - {name: tile_size, type: integer, label: Tile size (pixels), description: 'All models. 0 selects model preset; manual values must be at least 64 and divisible by 8 (32 for Noise2Noise).', default: 0, minimum: 0, maximum: 2048, cli_tag: --tile-size, cli_order: 20, optional: true, section_id: advanced, mode: advanced}
  - {name: overlap, type: integer, label: Tile overlap (pixels), description: All models. -1 selects model preset; otherwise smaller than tile size., default: -1, minimum: -1, maximum: 2047, cli_tag: --overlap, cli_order: 21, optional: true, section_id: advanced, mode: advanced}
  - {name: batch_size, type: integer, label: Tile batch size (0 = preset), description: "All models; more tiles per batch use more GPU memory.", default: 0, minimum: 0, maximum: 128, cli_tag: --batch-size, cli_order: 22, optional: true, section_id: advanced, mode: advanced}
  - name: output_dtype
    type: dropdown
    label: Output data type
    description: All models in ordinary OME-Zarr mode; ignored by PNG galleries.
    options: [{label: Preserve source dtype, value: source}, {label: Float32, value: float32}]
    default: source
    cli_tag: --output-dtype
    cli_order: 23
    optional: true
    section_id: advanced
    mode: advanced
  - {name: precision, type: dropdown, label: Inference precision, description: "All models. Auto uses FP16 only for FluoResFM CUDA; FP32 otherwise. Explicit FP16 requires CUDA.", options: [{label: Automatic (FP16 FluoResFM CUDA), value: auto}, {label: Float32 reference, value: float32}, {label: Float16 CUDA, value: float16}], default: auto, cli_tag: --precision, cli_order: 24, optional: true, section_id: advanced, mode: advanced}
  - name: structure_1
    type: dropdown
    label: Channel 1 structure
    description: FluoResFM only; ignored by other models. Task-only adds no biological structure prompt.
    options:
    - label: Task only / unspecified
      value: task-only
    - label: Nuclei
      value: nuclei
    - label: Neuronal processes
