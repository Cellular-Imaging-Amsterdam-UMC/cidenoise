name: CPU contract tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -c "from pathlib import Path; Path('/tmp/cpu-requirements.txt').write_text('\n'.join(x for x in Path('requirements.txt').read_text().splitlines() if not x.startswith(('--', 'torch==', 'torchvision=='))))"
          python -m pip install -r /tmp/cpu-requirements.txt -r requirements_launcher.txt -r requirements_dev.txt
      - run: python -m pytest -q
